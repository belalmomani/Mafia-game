name: Android Release (signed)

# إن لم تُضَف أسرار التوقيع بعد، يبني هذا المسار نسخة debug بدل أن يفشل،
# كي تحصل دائمًا على APK قابل للتجربة. بعد إضافة الأسرار الأربعة يصدر نسخة release موقّعة.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Write google-services.json from secret (optional)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > app/google-services.json; fi
      - name: Download Tajawal font (SIL OFL)
        run: |
          mkdir -p app/src/main/res/font
          base="https://github.com/google/fonts/raw/main/ofl/tajawal"
          for pair in Regular:regular Medium:medium Bold:bold ExtraBold:extrabold; do
            src="${pair%%:*}"; dst="${pair##*:}"
            out="app/src/main/res/font/tajawal_${dst}.ttf"
            if curl -fsSL "$base/Tajawal-${src}.ttf" -o "$out" && [ "$(stat -c%s "$out")" -gt 10000 ]; then
              echo "OK $out"
            else
              echo "::warning::تعذر تنزيل Tajawal-${src}؛ سيُستعمل خط النظام"
              rm -f "$out"
            fi
          done
          ls -la app/src/main/res/font || true
      - name: Detect signing secrets
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::لا يوجد KEYSTORE_BASE64: سيُبنى APK من نوع debug بدل release الموقّع."
          fi
      - name: Build signed release
        if: steps.sign.outputs.has_key == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Build debug fallback
        if: steps.sign.outputs.has_key != 'true'
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mafia-build
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
