name: Generate Keystore (one time)

# يُشغَّل مرة واحدة فقط. ينتج ملف نصي فيه مفتاح التوقيع بصيغة base64 + كلمات المرور.
# نزّل الملف من Artifacts، احفظ القيم كـ Secrets، ثم احذف الـ Artifact وسجل التشغيل.
# احتفظ بنسخة خارجية آمنة: فقدان المفتاح يعني استحالة تحديث التطبيق على Google Play.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore release.jks -alias mafia -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Mafia Game, O=Mafia, C=JO"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEY_ALIAS=mafia"
            echo "KEYSTORE_BASE64=$(base64 -w0 release.jks)"
            echo ""
            echo "# بصمة SHA-1 (تحتاجها لتسجيل Google):"
            keytool -list -v -keystore release.jks -alias mafia -storepass "$PASS" | grep -E "SHA1|SHA-1"
          } > keystore-secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: keystore-secrets.txt
          retention-days: 1
